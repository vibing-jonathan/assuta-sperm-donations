<div class="w-16 h-16 mb-stack-md flex items-center justify-center bg-surface-container-low rounded-full">
<img alt="Logo" class="w-10 h-10 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLtKY9tRwzSDNlw8aGTDo8RW-ZnkfQXaxc1G2-U3aROY35YsYSasAVjJdyh5H0QunMp3KRUGu4GwQRifaepMp2wvP9FJCyxsu8c9UjEAyav--hju9_kMvJqd7G5rxKjCtavSiaiTEFAe3Jha3TRlEkmnPu0bVMSOhwS7V-cgz4-j9hEzrRMY0sraJY8rtgcF9jYx3iKIT61MIdK26Xza5L1vDCRKT7dh3hxPVNiWS-DMpD_z2rbqOI0UNz4"/>

<h1 class="font-display-lg text-display-lg text-primary mb-stack-sm tracking-tight">מערכת ניהול תורמים</h1>
<p class="font-label-caps text-label-caps text-secondary uppercase bg-surface-variant px-inset-squish py-unit rounded-full inline-flex items-center gap-2">
<span class="material-symbols-outlined text-[14px]">shield_lock</span>
                    כניסה למנהלים מורשים בלבד
                </p>
</div>
<!-- Login Form -->
<div class="p-container-margin">
<h2 class="font-title-sm text-title-sm mb-stack-md text-on-surface">כניסה למערכת</h2>
<!-- Error State (Hidden by default, used for demonstration) -->
<div class="hidden bg-error-container text-on-error-container p-inset-squish rounded border border-error/20 mb-stack-md flex items-start gap-3" id="error-message">
<span class="material-symbols-outlined text-error shrink-0">error</span>
<p class="font-body-dense text-body-dense mt-0.5">פרטי ההתחברות שגויים. אנא נסה שוב.</p>
</div>
<form action="#" class="space-y-stack-md flex flex-col" method="POST" onsubmit="event.preventDefault(); document.getElementById('error-message').classList.remove('hidden');">
<!-- Email Field -->
<div>
<label class="block font-body-dense text-body-dense text-on-surface-variant mb-unit" for="email">כתובת אימייל</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">mail</span>
</div>
<!-- RTL wrapper with LTR input for email -->
<input autocomplete="email" class="block w-full rounded border-outline-variant py-2 pr-3 pl-10 text-on-surface placeholder:text-outline-variant focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors font-data-mono text-data-mono text-left bg-surface-container-lowest" dir="ltr" id="email" name="email" placeholder="name@hospital.gov.il" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-unit">
<label class="block font-body-dense text-body-dense text-on-surface-variant" for="password">סיסמה</label>
<a class="font-body-dense text-body-dense text-primary hover:text-primary-container transition-colors focus:outline-none focus:underline" href="#">שכחת סיסמה?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center">
<button class="text-outline-variant hover:text-on-surface-variant transition-colors focus:outline-none" id="toggle-password" tabindex="-1" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility</span>
</button>
</div>
<input autocomplete="current-password" class="block w-full rounded border-outline-variant py-2 pr-3 pl-10 text-on-surface placeholder:text-outline-variant focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors font-data-mono text-data-mono text-left bg-surface-container-lowest" dir="ltr" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>

<div class="pt-stack-sm">
<button class="w-full bg-primary text-on-primary py-2.5 px-4 rounded font-title-sm text-title-sm hover:bg-tertiary-container focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-colors flex items-center justify-center gap-2" type="submit">

<!-- Password Visibility Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleButton = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');

            toggleButton.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                visibilityIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });
        });
    </script>
